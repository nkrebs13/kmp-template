org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
org.gradle.warning.mode=summary
# Isolated Projects: each project configures only itself (requires the configuration cache).
# Still incubating in Gradle 9, hence the `unsafe` prefix.
org.gradle.unsafe.isolated-projects=true

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC
# iOS targets can only build on macOS and are disabled elsewhere regardless. This silences KGP's
# "targets cannot be built on this machine and are disabled" warning on Linux CI.
kotlin.native.ignoreDisabledTargets=true

# App version, read by the convention.android.application plugin. Override with -Papp.versionCode=…
app.versionCode=1
app.versionName=1.0.0

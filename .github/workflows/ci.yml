name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so toolchain drift and broken catalog coordinates surface without a PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt

  android:
    name: Android & Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # `check` skips the iOS targets on Linux (the ios job covers them) and runs the jvm tests.
      # createDistributable builds the jpackage app image; packageDistributionForCurrentOS would
      # also need dpkg/fakeroot on the runner for the installer, which adds nothing to the check.
      - name: Check, release build, baseline profile module, desktop distributable
        run: ./gradlew check :shared:koverHtmlReport :androidApp:assembleRelease :baselineprofile:assemble :desktopApp:createDistributable

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            shared/build/reports/kover/
            androidApp/build/reports/lint-results-*.html
            **/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Shared tests and framework
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Lint privacy manifest
        run: plutil -lint iosApp/iosApp/PrivacyInfo.xcprivacy

      # Builds the app the way Xcode does, including the Gradle build phase that embeds the framework.
      # CODE_SIGNING_ALLOWED=NO: simulator builds need no team. pipefail keeps xcodebuild's exit code.
      - name: Build iOS app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore

  verify-catalog:
    name: Verify catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Every library and plugin in libs.versions.toml, including the optional entries no build
      # file references, must still resolve. Runs on every event, so a PR (such as a Dependabot
      # bump) can't merge a coordinate that doesn't exist.
      - name: Resolve every catalog coordinate
        run: ./gradlew verifyCatalog

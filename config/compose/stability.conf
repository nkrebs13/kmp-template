// Compose compiler stability configuration, wired up by the convention.compose plugin.
// Lists types the compiler cannot prove stable but which are, so composables that take them
// can skip recomposition when their arguments are unchanged. Comments use `//`.

// Read-only Kotlin collection interfaces. MutableList, MutableSet and MutableMap are not stable
// and are deliberately not listed.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// kotlin.time value types (Duration, Instant)
kotlin.time.*

